[project]
name = "ci-context-mcp"
version = "0.1.0"
description = "Read-only MCP server that gives coding assistants CI runs, logs, test results, and coverage"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28.0", "pydantic>=2.10.0"]

[project.scripts]
ci-context-mcp = "ci_context_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_context_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
